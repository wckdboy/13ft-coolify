# Reverse proxy for the 13ft app, with the custom landing page at "/".
#
# Routing rules:
#   GET/HEAD /            -> static landing page (this image)
#   everything else       -> 13ft upstream, untouched:
#                            /<url>            bypass (GET, results cached 5 min)
#                            /status?url=      SSE progress stream
#                            /article          form POST (field name: link)
#                            /favicon.ico      upstream logo
#
# Only the exact path "/" is served locally, so upstream routes such as
# /status, /article and /favicon.ico keep working unmodified.

upstream 13ft_app {
    server app:5000;
    keepalive 16;
}

server {
    listen 80;
    # NOTE: no `listen [::]:80` — Docker's default bridge network is IPv4-only and
    # nginx fails to start if it cannot bind an IPv6 socket. Coolify's Traefik
    # reaches this container over IPv4.
    server_name _;

    server_tokens off;
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # Cap request bodies: nothing here ever posts more than a URL.
    client_max_body_size 64k;
    client_body_timeout 30s;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types text/html text/plain text/css application/javascript
               application/json image/svg+xml;

    # ---- landing page ------------------------------------------------------
    # Exact "/" only. POSTs go upstream so the app's own form route keeps
    # working if anything posts here; the 418 + error_page pair is nginx's
    # standard way to delegate a request from a static location.
    location = / {
        error_page 418 = @app;
        if ($request_method = POST) {
            return 418;
        }
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # ---- 13ft upstream -----------------------------------------------------
    location @app {
        proxy_pass http://13ft_app;
        include /etc/nginx/conf.d/proxy_13ft.inc;
    }

    location / {
        proxy_pass http://13ft_app;
        include /etc/nginx/conf.d/proxy_13ft.inc;
    }
}
