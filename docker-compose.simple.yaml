# Minimal variant: the upstream 13ft app on its own, no custom landing page.
# Use this if you only want the stock 13ft UI, or for quick local testing:
#
#   docker compose -f docker-compose.simple.yml up -d
#   open http://localhost:8080
#
# In Coolify: assign a domain to service `app` on port 5000.

name: 13ft-simple

services:
  app:
    image: ghcr.io/wasi-master/13ft:latest
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8080}:5000"
    environment:
      PORT: "5000"
      LOCALE: ${LOCALE:-en}
      TZ: ${TZ:-UTC}
      GUNICORN_CMD_ARGS: >-
        --worker-class gthread
        --workers 1
        --threads ${GUNICORN_THREADS:-8}
        --timeout ${GUNICORN_TIMEOUT:-180}
        --graceful-timeout 30
        --access-logfile -
        --error-logfile -
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
